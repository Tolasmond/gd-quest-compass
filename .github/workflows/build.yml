name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Build x64 loader and overlay
        shell: cmd
        run: |
          call build.cmd
          if errorlevel 1 exit /b 1
      - name: Package prebuilt overlay
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = Join-Path $env:RUNNER_TEMP 'gd-quest-compass'
          $files = @(
            'README.md'
            'LICENSE'
            'THIRD_PARTY_NOTICES.md'
            'Launch-GrimDawn-With-Overlay.cmd'
            'Launch-GrimDawn-With-Overlay.ps1'
            'Start-PositionOverlay.ps1'
            'build/position-loader.exe'
            'build/position-overlay.dll'
            'data/guide/README.md'
            'data/guide/defaults.json'
            'data/guide/personal.json'
            'data/guide/quest-entities.json'
            'vendor/Detours/LICENSE'
          )
          foreach ($file in $files) {
            $destination = Join-Path $package $file
            New-Item -ItemType Directory -Path (Split-Path $destination -Parent) -Force | Out-Null
            Copy-Item -LiteralPath $file -Destination $destination
          }
          Compress-Archive -LiteralPath $package -DestinationPath 'gd-quest-compass-windows-x64.zip' -Force
      - name: Upload prebuilt ZIP
        uses: actions/upload-artifact@v7
        with:
          path: gd-quest-compass-windows-x64.zip
          archive: false
          if-no-files-found: error
